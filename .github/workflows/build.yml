name: Build Optimized Kernel + AnyKernel3 (boot only)

on:
  workflow_dispatch:
    inputs:
      lto:
        description: 'LTO mode'
        required: true
        default: 'thin'
        type: choice
        options: [thin, full]
      power_lean:
        description: 'PART 3.5: 1=删除 DEBUG_INFO（仅减小 vmlinux）, 0=保留'
        required: true
        default: '1'
        type: choice
        options: ['1', '0']

env:
  LC_ALL: C
  LANG: C
  TZ: UTC
  # ⚠️ 必须 consolidate：
  #   - consolidate 的 GKI 趟 POST_DEFCONFIG_CMDS 被 gki_consolidate.aarch64 覆盖为 rm，
  #     不跑 check_defconfig → 配置可自由改动
  #   - VARIANT=gki 会跑 check_defconfig，配合 build.sh:357 的全局 set -e
  #     → 配置与 savedefconfig 不一致时构建直接中止
  VARIANT: consolidate
  LTO_MODE: ${{ github.event.inputs.lto || 'thin' }}
  POWER_LEAN: ${{ github.event.inputs.power_lean || '1' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      # ---------------------------------------------------------------- 0. 空间
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 16384
          temp-reserve-mb: 4096
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      # ---------------------------------------------------------------- 1. 依赖
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bison flex libssl-dev bc cpio rsync python3 python-is-python3 \
            lz4 xz-utils zip unzip git curl build-essential
          python --version || true
          zip -v | head -2

      # ---------------------------------------------------------------- 2. 检出工作流仓库
      - name: Checkout workflow repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ---------------------------------------------------------------- 3. repo 工具
      - name: Install repo tool
        run: |
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/repo
          chmod a+x ~/repo
          sudo mv ~/repo /usr/local/bin/repo

      - name: Configure git
        run: |
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config --global --add safe.directory '*'

      - name: Verify workflow repo files
        run: |
          echo "=== workspace ==="; ls -la "$GITHUB_WORKSPACE"
          echo "=== scripts ===";  ls -la "$GITHUB_WORKSPACE/scripts"  || echo "scripts NOT FOUND"
          echo "=== manifest ==="; ls -la "$GITHUB_WORKSPACE/manifest" || echo "manifest NOT FOUND"
          test -f "$GITHUB_WORKSPACE/scripts/apply.sh"     || echo "::error::scripts/apply.sh 缺失"
          test -f "$GITHUB_WORKSPACE/scripts/anykernel.sh" || echo "::error::scripts/anykernel.sh 缺失"

      # ---------------------------------------------------------------- 4. 同步源码
      - name: Init & sync source
        run: |
          mkdir k && cd k
          repo init -u https://github.com/${{ github.repository }}.git \
                    -m manifest/oneplus_10t.xml --depth=1
          repo sync -c -j8 --force-sync
          echo "=== 顶层 ==="; ls -la
          echo "=== 关键树 ==="
          for p in kernel_platform/common kernel_platform/msm-kernel \
                   kernel_platform/prebuilts-master/clang/host/linux-x86; do
            if [ -e "$p" ]; then echo "OK   $p"; else echo "::error::缺失 $p"; fi
          done
          echo "=== device/qcom/taro-kernel（纯 boot 方案不需要；仅打包 img 时用） ==="
          if [ -e device/qcom/taro-kernel ]; then
            echo "  有   device/qcom/taro-kernel → 可产出 boot.img/vendor_boot.img/dtbo.img"
          else
            echo "  无   device/qcom/taro-kernel → 不会产出 boot.img 等，纯 boot 方案无影响"
          fi
          echo "=== vendor/oplus（本 manifest 不含，属正常；构建不需要它） ==="
          ls -d vendor/oplus 2>/dev/null || echo "  (absent, expected)"
          for d in kernel_platform/common kernel_platform/msm-kernel; do
            ( cd "$d" 2>/dev/null && git tag -f v5.10.236 HEAD >/dev/null 2>&1 || true )
          done

      # ---------------------------------------------------------------- 5. 前提自检
      - name: Preflight checks
        run: |
          set -e
          MISS=0
          # 必需（构建入口 / 配置 / 工具链入口）
          for p in k/kernel_platform/build/android/prepare_vendor.sh \
                   k/kernel_platform/build/build.sh \
                   k/kernel_platform/build/brunch \
                   k/kernel_platform/common/arch/arm64/configs/gki_defconfig \
                   k/kernel_platform/common/arch/arm64/configs/consolidate.fragment \
                   k/kernel_platform/msm-kernel/arch/arm64/configs/gki_defconfig \
                   k/kernel_platform/prebuilts-master/clang/host/linux-x86; do
            if [ -e "$p" ]; then echo "OK   $p"; else echo "::error::缺失 $p"; MISS=$((MISS+1)); fi
          done

          # 纯 boot 方案不依赖从 device/qcom 打包 img；缺失仅说明无法产出 boot.img 等
          for p in k/device/qcom/taro-kernel k/vendor/qcom/proprietary; do
            if [ -e "$p" ]; then
              echo "OK   $p"
            else
              echo "  --   $p 不存在（纯 boot 方案不需要，跳过 img 打包）"
            fi
          done

          echo "=== apply.sh 依赖的锚点 ==="
          grep -n '^endmenu' k/kernel_platform/common/drivers/char/Kconfig | tail -1
          tail -1 k/kernel_platform/common/drivers/char/Makefile
          grep -c 'drbg_cores\[\] = {' k/kernel_platform/common/crypto/drbg.c || true
          grep -c 'ttwu_stat' k/kernel_platform/common/kernel/sched/core.c || true

          echo "=== 省电减法目标符号存在性（PART 3.5 只会删 DEBUG_INFO） ==="
          echo -n "  DEBUG_INFO 行数(common): "
          grep -cE '^#? ?CONFIG_DEBUG_INFO' k/kernel_platform/common/arch/arm64/configs/gki_defconfig || true
          echo -n "  DEBUG_INFO 行数(msm):    "
          grep -cE '^#? ?CONFIG_DEBUG_INFO' k/kernel_platform/msm-kernel/arch/arm64/configs/gki_defconfig || true
          echo "  CRC 相关项（必须保留为 y）:"
          for s in KASAN KASAN_HW_TAGS KFENCE PAGE_OWNER UBSAN LOCKDEP; do
            v=$(grep -E "^CONFIG_${s}=y$" k/kernel_platform/common/arch/arm64/configs/gki_defconfig | head -1)
            echo "    ${s}: ${v:-<未找到>}"
          done

          echo "=== PART 3.6 前置：LOCALVERSION_AUTO 的依赖符号 MODULE_SCMVERSION ==="
          # common/init/Kconfig: MODULE_SCMVERSION 带 depends on LOCALVERSION_AUTO。
          # 关闭 LOCALVERSION_AUTO 后它会变不可见符号，若不从 defconfig 一并删除，
          # vendor 趟 check_merged_defconfig 会输出 "-MODULE_SCMVERSION y" 并以 exit 1 中止。
          for f in k/kernel_platform/common/arch/arm64/configs/gki_defconfig \
                   k/kernel_platform/msm-kernel/arch/arm64/configs/gki_defconfig; do
            echo -n "  $(basename $(dirname $(dirname $(dirname $(dirname $f)))))/gki_defconfig: "
            grep -E '^#? ?CONFIG_(LOCALVERSION_AUTO|MODULE_SCMVERSION)' "$f" | tr '\n' ' '
            echo ""
          done

          echo "=== boot.img 用的内核文件（KERNEL_BINARY） ==="
          grep -n 'KERNEL_BINARY' k/kernel_platform/msm-kernel/build.config.msm.common

          [ "$MISS" -eq 0 ] || { echo "::error::共 $MISS 个必需路径缺失"; exit 1; }

      # ---------------------------------------------------------------- 6. 打补丁 + 配置
      - name: Apply optimizations (SSG + LRNG + configs + DEBUG_INFO)
        run: |
          set -e
          cp "$GITHUB_WORKSPACE/scripts/apply.sh" /tmp/apply.sh
          chmod +x /tmp/apply.sh
          cd k
          ROM_ROOT="$PWD" RUN_BUILD=0 LTO_MODE="${LTO_MODE}" POWER_LEAN="${POWER_LEAN}" \
            bash /tmp/apply.sh 2>&1 | tee apply.log

      # ---------------------------------------------------------------- 7. 构建
      #  本 manifest 无 vendor/oplus → oplus_build_kernel.sh 不可用
      #  （其 build_cmd 硬 source vendor/oplus/kernel/prebuilt/vendorsetup.sh）
      #  故直接调 prepare_vendor.sh，并补齐 oplus_build_kernel.sh 会设置的环境变量。
      - name: Build kernel (LTO=${{ env.LTO_MODE }}, POWER_LEAN=${{ env.POWER_LEAN }})
        run: |
          set -euo pipefail
          cd k
          export LTO="${LTO_MODE}"
          export TOPDIR="$PWD"
          export ANDROID_BUILD_TOP="$PWD"
          export TARGET_BOARD_PLATFORM=taro
          export ANDROID_PRODUCT_OUT="$PWD/out/target/product/taro"
          export CHIPSET_COMPANY=QCOM
          export OPLUS_VND_BUILD_PLATFORM=SM8475
          mkdir -p "$ANDROID_PRODUCT_OUT" LOGDIR

          echo "LTO=${LTO}  VARIANT=${VARIANT}  POWER_LEAN=${POWER_LEAN}"
          echo "ANDROID_BUILD_TOP=${ANDROID_BUILD_TOP}"
          echo "ANDROID_PRODUCT_OUT=${ANDROID_PRODUCT_OUT}"

          set +e
          ./kernel_platform/build/android/prepare_vendor.sh waipio "${VARIANT}" 2>&1 | tee build.log
          RC=${PIPESTATUS[0]}
          set -e
          echo "prepare_vendor.sh exit=${RC}"

          if [ "$RC" -ne 0 ]; then
            echo "================ 失败诊断 ================"
            echo "--- defconfig 守卫（这些是 exit 1 的来源）---"
            grep -nE 'ERROR!|Defconfig fragment did not apply|Detected overridden config|Treating config warnings|Previous value' build.log | head -30 || true
            echo "--- Kconfig 告警 ---"
            grep -nE 'warning:' build.log | head -30 || true
            echo "--- 编译错误 ---"
            grep -nE '^make.*Error|Error [0-9]+|\*\*\*|No rule to make' build.log | head -30 || true
            echo "=========================================="
          fi
          exit "$RC"

      # ---------------------------------------------------------------- 8. 验证
      - name: Verify patches, LTO, CRC-safety and artifacts
        if: always()
        run: |
          cd k || exit 0
          OUT="kernel_platform/out/msm-waipio-waipio-${VARIANT}"
          FAIL=0

          echo "=== A) LTO ==="
          if grep -q "Modifying LTO mode to '${LTO_MODE}'" build.log 2>/dev/null; then
            grep -n "Modifying LTO mode to '${LTO_MODE}'" build.log | head -2
          else
            echo "::error::未见 LTO 改写日志"; FAIL=$((FAIL+1))
          fi

          echo "=== B) ★ CRC 保护校验（纯 boot 方案的核心）★ ==="
          # 纯 boot 要求：所有影响符号 CRC 的 CONFIG 必须保持为 y（与原厂一致），
          # 否则原厂 vendor_dlkm/odm_dlkm 模块会因 "disagrees about version of
          # symbol" 被拒载（CONFIG_MODVERSIONS=y，MODULE_FORCE_LOAD=n）
          CRC_MUST_BE_Y='CONFIG_(KASAN|KASAN_HW_TAGS|KFENCE|PAGE_OWNER|UBSAN|UBSAN_TRAP|UBSAN_LOCAL_BOUNDS|LOCKDEP|LOCK_STAT|DEBUG_LOCK_ALLOC|DEBUG_OBJECTS|DEBUG_PREEMPT|DEBUG_SPINLOCK|DEBUG_MUTEXES|DEBUG_RT_MUTEXES|DEBUG_RWSEMS|SLUB_DEBUG_ON|PAGE_POISONING|DYNAMIC_DEBUG|KUNIT)'
          for c in "${OUT}/gki_kernel/common/.config" "${OUT}/msm-kernel/.config"; do
            if [ ! -f "$c" ]; then echo "::warning::$c 不存在"; continue; fi
            echo "--- $c ---"
            if grep -qE "^${CRC_MUST_BE_Y}=y" "$c"; then
              N=$(grep -cE "^${CRC_MUST_BE_Y}=y" "$c")
              echo "OK: CRC 相关配置保持为 y（$N 项）"
              grep -E "^${CRC_MUST_BE_Y}=y" "$c" | head -25 || true
            else
              echo "::error::未找到任何 CRC 相关配置为 y —— 纯 boot 方案失效！"
              echo "::error::删除这些项会改变 __kcrctab，原厂模块将全部拒载"
              FAIL=$((FAIL+1))
            fi
            echo "--- 被删除的调试项（必须为空）---"
            if grep -qE "^# CONFIG_(KASAN|KFENCE|PAGE_OWNER|UBSAN|LOCKDEP)=n$" "$c"; then
              echo "::warning::检测到显式 n（正常，删除行也会导致默认 n）"
            fi
          done

          echo "=== C) DEBUG_INFO 允许删除，其余插桩不允许 ==="
          for c in "${OUT}/gki_kernel/common/.config" "${OUT}/msm-kernel/.config"; do
            [ -f "$c" ] || continue
            echo "--- $(basename $(dirname $(dirname $c))) ---"
            grep -E '^#? ?CONFIG_DEBUG_INFO(_DWARF4)?=' "$c" || echo "  (DEBUG_INFO 已删除，符合预期)"
            if grep -qE '^CONFIG_(KASAN|KFENCE|PAGE_OWNER|UBSAN|LOCKDEP)=' "$c"; then
              echo "  OK: CRC 相关项保留"
            else
              echo "  ::error::CRC 相关项缺失，纯 boot 方案失效"; FAIL=$((FAIL+1))
            fi
          done

          echo "=== C2) LOCALVERSION_AUTO / MODULE_SCMVERSION 一致性 ==="
          # 二者是 depends on 关系：关掉前者若不删后者，vendor 趟
          # check_merged_defconfig 会输出 "-MODULE_SCMVERSION y" → exit 1
          for c in "${OUT}/gki_kernel/common/.config" "${OUT}/msm-kernel/.config"; do
            [ -f "$c" ] || continue
            LA=$(grep -cE '^CONFIG_LOCALVERSION_AUTO=y$' "$c" || true)
            MS=$(grep -cE '^CONFIG_MODULE_SCMVERSION=y$' "$c" || true)
            echo "--- $(basename $(dirname $(dirname $c))): LOCALVERSION_AUTO=$LA MODULE_SCMVERSION=$MS ---"
            if [ "$LA" = "0" ] && [ "$MS" != "0" ]; then
              echo "  ::error::LOCALVERSION_AUTO 已关但 MODULE_SCMVERSION 仍为 y（不可能共存，会构建失败）"
              FAIL=$((FAIL+1))
            else
              echo "  OK: 二者一致"
            fi
          done
          echo "--- 源 defconfig 中不应残留 MODULE_SCMVERSION ---"
          for f in kernel_platform/common/arch/arm64/configs/gki_defconfig \
                   kernel_platform/msm-kernel/arch/arm64/configs/gki_defconfig; do
            if grep -qE '^#? ?CONFIG_MODULE_SCMVERSION=' "$f"; then
              echo "  ::error::$f 仍残留 MODULE_SCMVERSION 行 —— 会导致 -MODULE_SCMVERSION 差异并中止构建"
              grep -nE '^#? ?CONFIG_MODULE_SCMVERSION=' "$f"
              FAIL=$((FAIL+1))
            else
              echo "  OK  $f 无残留"
            fi
          done

          echo "=== D) 源码落盘 ==="
          ls -l kernel_platform/common/block/ssg-iosched.c || FAIL=$((FAIL+1))
          echo -n "lrng 文件数: "; ls kernel_platform/common/drivers/char/lrng 2>/dev/null | wc -l
          ls -l kernel_platform/common/include/linux/lrng.h || FAIL=$((FAIL+1))
          echo -n "consolidate.fragment 行数: "
          wc -l < kernel_platform/common/arch/arm64/configs/consolidate.fragment 2>/dev/null || echo 0

          echo "=== E) 产物列表 ==="
          echo "--- dist（vendor 趟产物，纯 boot 方案可缺）---"
          ls -lh "${OUT}/dist/" 2>/dev/null || echo "  (不存在，纯 boot 无需)"
          echo "--- gki_kernel/dist（GKI 趟产物，Image 在这里）---"
          ls -lh "${OUT}/gki_kernel/dist/" 2>/dev/null || echo "  ::error::gki_kernel/dist 不存在（Image 无法产出）"

          echo "=== F) Image 体积（保留插桩，应与基线 ~57MB 接近，而非 39MB）==="
          IMG="${OUT}/gki_kernel/dist/Image"
          if [ -s "$IMG" ]; then
            SZ=$(stat -c %s "$IMG")
            echo "Image = ${SZ} bytes ($((SZ/1024/1024)) MB)"
            if [ "$SZ" -lt 45000000 ]; then
              echo "::warning::Image 明显小于基线（57MB），说明插桩可能被误删，CRC 会变"
            fi
          else
            echo "::error::Image 缺失（纯 boot 方案的核心产物，不可缺失）"; FAIL=$((FAIL+1))
          fi

          echo "=== G) 纯 boot 方案只需 Image；其余产物均为可选 ==="
          # 纯 boot：AK3 用 gki_kernel/dist/Image 自行组装 boot，
          # 不需要 dist/boot.img、vendor_boot.img、dtbo.img。
          # 这三个文件由 vendor 趟产出，而 vendor 趟依赖 device/qcom/taro-kernel；
          # 该目录缺失时它们不会生成，属于环境问题，不应判本方案失败。
          for f in Image Image.lz4 System.map vmlinux; do
            if [ -s "${OUT}/gki_kernel/dist/$f" ]; then
              echo "OK   gki_kernel/dist/$f"
            else
              echo "::error::gki_kernel/dist/$f 缺失"; FAIL=$((FAIL+1))
            fi
          done
          echo "--- 可选产物（缺失不判失败，仅提示）---"
          for f in boot.img vendor_boot.img dtbo.img; do
            if [ -s "${OUT}/dist/$f" ]; then
              echo "  有   dist/$f ($(du -h "${OUT}/dist/$f" | cut -f1))"
            else
              echo "  无   dist/$f —— 纯 boot 方案不需要，跳过"
            fi
          done

          if [ "$FAIL" -ne 0 ]; then echo "::error::共 $FAIL 项校验失败"; exit 1; fi
          echo "全部校验通过 ✅"

      # ---------------------------------------------------------------- 9. 打包 AK3
      - name: Package AnyKernel3 zip (boot only)
        if: always()
        run: |
          set -euo pipefail
          cd k
          OUT="kernel_platform/out/msm-waipio-waipio-${VARIANT}"
          IMG="${OUT}/gki_kernel/dist/Image"

          if [ ! -s "$IMG" ]; then
            echo "::error::Image 缺失，无法打包 AK3"
            exit 1
          fi

          echo "=== 1) 拉取 AK3 模板 ==="
          rm -rf /tmp/ak3
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git /tmp/ak3
          rm -rf /tmp/ak3/.git /tmp/ak3/README.md
          rm -f /tmp/ak3/Image* /tmp/ak3/zImage* /tmp/ak3/dzImage /tmp/ak3/boot.img

          echo "=== 2) 放入内核镜像（boot.img 用未压缩 Image：KERNEL_BINARY=Image） ==="
          cp "$IMG" /tmp/ak3/Image
          ls -lh /tmp/ak3/Image

          echo "=== 3) 纯 boot 模式：不打包任何其他分区 ==="
          echo "  vendor_dlkm.img / odm_dlkm.img / dtbo.img 均不放入 AK3 包"
          echo "  （本内核 CRC 与原厂一致，原厂模块可直接继续使用）"

          echo "=== 4) 写入定制 anykernel.sh ==="
          cp "$GITHUB_WORKSPACE/scripts/anykernel.sh" /tmp/ak3/anykernel.sh

          echo "=== 5) 打包 ==="
          cd /tmp/ak3
          ZIP_NAME="PGP110-Kernel-${VARIANT}-${LTO_MODE}-$(date +%Y%m%d-%H%M).zip"
          zip -r9 "$ZIP_NAME" anykernel.sh META-INF tools Image
          cp "$ZIP_NAME" "$GITHUB_WORKSPACE/"
          echo "=== AK3 包内容 ==="
          unzip -l "$ZIP_NAME" | head -30
          ls -lh "$ZIP_NAME"

          echo "=== 6) 硬校验：包内必须有 anykernel.sh / update-binary / Image，且不含模块分区 ==="
          for need in anykernel.sh META-INF/com/google/android/update-binary Image; do
            if unzip -l "$ZIP_NAME" | grep -q "$need"; then
              echo "OK  $need"
            else
              echo "::error::AK3 包缺少 $need"
              exit 1
            fi
          done
          for forbid in vendor_dlkm.img odm_dlkm.img dtbo.img; do
            if unzip -l "$ZIP_NAME" | grep -q "$forbid"; then
              echo "::error::AK3 包不应包含 $forbid（纯 boot 模式）"
              exit 1
            fi
          done
          echo "AK3 包正确（纯 boot：仅 anykernel.sh + tools + Image）✅"
          echo "AK3 包完整（Image + vendor_dlkm + odm_dlkm）✅"

      # ---------------------------------------------------------------- 10. 上传
      - name: Upload AnyKernel3 zip
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anykernel3-${{ env.VARIANT }}-${{ env.LTO_MODE }}-lean${{ env.POWER_LEAN }}
          path: ${{ github.workspace }}/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload GKI images (required)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gki-images-${{ env.VARIANT }}-${{ env.LTO_MODE }}-lean${{ env.POWER_LEAN }}
          path: |
            k/kernel_platform/out/*/gki_kernel/dist/Image
            k/kernel_platform/out/*/gki_kernel/dist/Image.lz4
            k/kernel_platform/out/*/gki_kernel/dist/System.map
            k/kernel_platform/out/*/gki_kernel/dist/vmlinux
            k/kernel_platform/out/*/gki_kernel/dist/modules.builtin*
            k/kernel_platform/out/*/gki_kernel/dist/abi.*
          if-no-files-found: error
          retention-days: 14

      - name: Check vendor dist exists
        id: check_dist
        if: always()
        run: |
          if ls k/kernel_platform/out/*/dist/*.img >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "vendor dist 存在，将上传"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "vendor dist 不存在（纯 boot 模式正常），跳过上传"
          fi

      - name: Upload vendor dist images (optional)
        if: always() && steps.check_dist.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vendor-dist-${{ env.VARIANT }}-${{ env.LTO_MODE }}-lean${{ env.POWER_LEAN }}
          path: |
            k/kernel_platform/out/*/dist/*.img
            k/kernel_platform/out/*/dist/*.tar.gz
            k/kernel_platform/out/*/dist/Module.symvers
          if-no-files-found: warn
          retention-days: 14

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-lean${{ env.POWER_LEAN }}
          path: |
            k/build.log
            k/apply.log
            /tmp/lrng-ssg-patches/log
          if-no-files-found: warn
